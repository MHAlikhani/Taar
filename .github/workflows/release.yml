name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows installer first; add macos-latest / ubuntu-latest when ready
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Electrobun toolchain
        uses: actions/cache@v4
        with:
          path: .hutch
          key: hutch-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Test before packaging
        run: bun test

      - name: Production build
        run: bunx electrobun build --env=stable

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.tar.zst' -o -name 'update.json' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: false
